---
- name: Provision Baseline Configuration across All Hosts
  hosts: all
  become: yes
  roles:
    - common

- name: Setup Docker Engine on Application Hosts
  hosts: all
  become: yes
  roles:
    - docker

- name: Prepare Kubernetes Cluster Nodes
  hosts: k8s_cluster
  become: yes
  roles:
    - k8s_prep
