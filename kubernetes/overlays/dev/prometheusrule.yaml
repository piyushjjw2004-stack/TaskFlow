apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: taskflow-alerts
  namespace: taskflow
  labels:
    release: kube-prometheus-stack
spec:
  groups:
    - name: taskflow
      rules:
        - alert: TaskFlowBackendDown
          expr: up{service="backend"} == 0
          for: 1m
          labels:
            severity: critical
          annotations:
            summary: TaskFlow backend is down
            description: Backend metrics endpoint has been unavailable for more than one minute.
        - alert: TaskFlowHighErrorRate
          expr: sum(rate(taskflow_http_requests_total{status_code=~"5.."}[5m])) / clamp_min(sum(rate(taskflow_http_requests_total[5m])), 1e-9) > 0.05
          for: 2m
          labels:
            severity: warning
          annotations:
            summary: TaskFlow 5xx error rate is above 5 percent
            description: Investigate recent application errors and dependency health.
        - alert: TaskFlowHighLatency
          expr: histogram_quantile(0.95, sum(rate(taskflow_http_request_duration_seconds_bucket[5m])) by (le)) > 1.5
          for: 3m
          labels:
            severity: warning
          annotations:
            summary: TaskFlow p95 latency is above 1.5 seconds
            description: Investigate application latency, database performance and resource saturation.
