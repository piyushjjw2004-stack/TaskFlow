name: TaskFlow Continuous Delivery

on:
  push:
    branches: [main]
    tags: ['v*.*.*']

env:
  AWS_REGION: us-east-1
  ECR_BACKEND_REPOSITORY: taskflow-backend-prod
  ECR_FRONTEND_REPOSITORY: taskflow-frontend-prod
  EKS_CLUSTER_NAME: taskflow-prod-eks
  K8S_NAMESPACE: taskflow

permissions:
  contents: read
  id-token: write

jobs:
  build-scan-publish:
    name: Build, Scan & Publish Images
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          load: true
          tags: taskflow-backend:${{ github.sha }}

      - name: Build Frontend Image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          load: true
          tags: taskflow-frontend:${{ github.sha }}

      - name: Scan Backend Image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: taskflow-backend:${{ github.sha }}
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'

      - name: Scan Frontend Image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: taskflow-frontend:${{ github.sha }}
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'

      - name: Tag and Push Backend
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          docker tag taskflow-backend:${GITHUB_SHA} ${REGISTRY}/${ECR_BACKEND_REPOSITORY}:${GITHUB_SHA}
          docker push ${REGISTRY}/${ECR_BACKEND_REPOSITORY}:${GITHUB_SHA}

      - name: Tag and Push Frontend
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          docker tag taskflow-frontend:${GITHUB_SHA} ${REGISTRY}/${ECR_FRONTEND_REPOSITORY}:${GITHUB_SHA}
          docker push ${REGISTRY}/${ECR_FRONTEND_REPOSITORY}:${GITHUB_SHA}

  deploy:
    name: Deploy to EKS & Verify
    needs: build-scan-publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Install kubectl
        uses: azure/setup-kubectl@v4

      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.16.4

      - name: Configure kubeconfig
        run: aws eks update-kubeconfig --region "$AWS_REGION" --name "$EKS_CLUSTER_NAME"

      - name: Ensure namespace exists
        run: kubectl create namespace "$K8S_NAMESPACE" --dry-run=client -o yaml | kubectl apply -f -

      - name: Install NGINX Ingress Controller
        run: |
          helm repo add ingress-nginx https://kubernetes.github.io/ingress-nginx
          helm repo update
          helm upgrade --install ingress-nginx ingress-nginx/ingress-nginx --namespace ingress-nginx --create-namespace --wait

      - name: Install Metrics Server
        run: |
          helm repo add metrics-server https://kubernetes-sigs.github.io/metrics-server/
          helm repo update
          helm upgrade --install metrics-server metrics-server/metrics-server --namespace kube-system --wait

      - name: Install Prometheus & Grafana
        run: |
          helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
          helm repo update
          helm upgrade --install kube-prometheus-stack prometheus-community/kube-prometheus-stack \
            --namespace monitoring --create-namespace \
            --values monitoring/kube-prometheus-stack-values.yaml \
            --wait --timeout 10m
          kubectl -n monitoring create configmap taskflow-dashboard \
            --from-file=taskflow-dashboard.json=monitoring/grafana/dashboards/taskflow-dashboard.json \
            --dry-run=client -o yaml | kubectl label --local -f - grafana_dashboard=1 -o yaml | kubectl apply -f -

      - name: Create runtime Secret
        env:
          POSTGRES_PASSWORD: ${{ secrets.TASKFLOW_POSTGRES_PASSWORD }}
          SECRET_KEY: ${{ secrets.TASKFLOW_SECRET_KEY }}
        run: |
          test -n "$POSTGRES_PASSWORD"
          test -n "$SECRET_KEY"
          ENCODED_PASSWORD=$(python -c 'import urllib.parse,os; print(urllib.parse.quote(os.environ["POSTGRES_PASSWORD"], safe=""))')
          kubectl -n "$K8S_NAMESPACE" create secret generic taskflow-secret \
            --from-literal=POSTGRES_PASSWORD="$POSTGRES_PASSWORD" \
            --from-literal=SECRET_KEY="$SECRET_KEY" \
            --from-literal=DATABASE_URL="postgresql://taskflow:${ENCODED_PASSWORD}@postgres:5432/taskflow_db" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Deploy with Helm
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          BACKEND_IMAGE="$ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/$ECR_BACKEND_REPOSITORY"
          FRONTEND_IMAGE="$ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/$ECR_FRONTEND_REPOSITORY"
          helm upgrade --install taskflow ./helm/taskflow \
            --namespace "$K8S_NAMESPACE" \
            --create-namespace \
            --values ./helm/taskflow/values-prod.yaml \
            --set backend.image.repository="$BACKEND_IMAGE" \
            --set backend.image.tag="$GITHUB_SHA" \
            --set frontend.image.repository="$FRONTEND_IMAGE" \
            --set frontend.image.tag="$GITHUB_SHA" \
            --atomic \
            --cleanup-on-fail \
            --wait-for-jobs \
            --timeout 10m

      - name: Register backend with Prometheus
        run: kubectl apply -k kubernetes/monitoring

      - name: Verify rollout
        run: |
          kubectl rollout status deployment/taskflow-backend -n "$K8S_NAMESPACE" --timeout=5m
          kubectl rollout status deployment/taskflow-frontend -n "$K8S_NAMESPACE" --timeout=5m
          kubectl get pods -n "$K8S_NAMESPACE"
          kubectl get hpa -n "$K8S_NAMESPACE"

      - name: Smoke test
        run: |
          kubectl -n "$K8S_NAMESPACE" port-forward svc/frontend 8080:80 >/tmp/taskflow-port-forward.log 2>&1 &
          PF_PID=$!
          trap 'kill $PF_PID' EXIT
          sleep 5
          curl --fail --retry 10 --retry-delay 2 http://127.0.0.1:8080/health
          curl --fail --retry 10 --retry-delay 2 http://127.0.0.1:8080/api/health
          curl --fail --retry 10 --retry-delay 2 http://127.0.0.1:8080/api/ready
          curl --fail --retry 10 --retry-delay 2 http://127.0.0.1:8080/api/ready/schema
