name: FinOps Cost Review

on:
  pull_request:
    paths:
      - "terraform/**"

jobs:
  cost-review:
    runs-on: ubuntu-latest
    if: ${{ vars.ENABLE_INFRACOST == 'true' }}
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.10.5
      - name: Initialize Terraform
        run: terraform -chdir=terraform/environments/prod init -backend=false
      - uses: infracost/actions/setup@v3
        with:
          api-key: ${{ secrets.INFRACOST_API_KEY }}
      - run: |
          infracost breakdown --path terraform/environments/prod --format json --out-file /tmp/infracost.json
          infracost output table --path /tmp/infracost.json
