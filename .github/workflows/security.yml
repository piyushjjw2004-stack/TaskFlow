name: Container & Code Security (Trivy)

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  schedule:
    - cron: '0 0 * * 0' # Weekly Sunday security scan

jobs:
  fs-security-scan:
    name: Trivy Filesystem & Dependency Vulnerability Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run Trivy FS Vulnerability Scanner
        uses: aquasecurity/trivy-action@v0.28.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'
          exit-code: '1'
          severity: 'HIGH,CRITICAL'
          scanners: 'vuln,misconfig'
          ignore-unfixed: true

  container-security-scan:
    name: Trivy Container Image Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Local Backend Container Image
        run: |
          docker build -t taskflow-backend:security-scan ./backend

      - name: Scan Backend Container with Trivy
        uses: aquasecurity/trivy-action@v0.28.0
        with:
          image-ref: 'taskflow-backend:security-scan'
          format: 'table'
          exit-code: '1'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true

      - name: Build Local Frontend Container Image
        run: |
          docker build -t taskflow-frontend:security-scan ./frontend

      - name: Scan Frontend Container with Trivy
        uses: aquasecurity/trivy-action@v0.28.0
        with:
          image-ref: 'taskflow-frontend:security-scan'
          format: 'table'
          exit-code: '1'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true
