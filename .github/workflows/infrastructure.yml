name: TaskFlow Infrastructure as Code

on:
  pull_request:
    paths:
      - 'terraform/**'
      - '.github/workflows/infrastructure.yml'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Terraform environment'
        required: true
        type: choice
        options:
          - dev
          - prod
      action:
        description: 'Terraform action'
        required: true
        type: choice
        options:
          - plan
          - apply

permissions:
  contents: read
  id-token: write

concurrency:
  group: taskflow-terraform-${{ github.event.inputs.environment || 'pr' }}
  cancel-in-progress: false

jobs:
  terraform:
    name: Terraform ${{ github.event.inputs.action || 'plan' }}
    runs-on: ubuntu-latest
    # Forked PRs cannot access repository secrets. They still receive the normal CI validation.
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    env:
      AWS_REGION: us-east-1
      TF_ENVIRONMENT: ${{ github.event.inputs.environment || 'dev' }}
      TF_ACTION: ${{ github.event.inputs.action || 'plan' }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.10.5

      - name: Terraform Format Check
        run: terraform fmt -check -recursive terraform

      - name: Initialize Terraform with Remote State
        working-directory: terraform/environments/${{ env.TF_ENVIRONMENT }}
        env:
          TF_STATE_BUCKET: ${{ secrets.TF_STATE_BUCKET }}
        run: |
          test -n "$TF_STATE_BUCKET"
          terraform init \
            -backend-config="bucket=$TF_STATE_BUCKET" \
            -backend-config="key=taskflow/${TF_ENVIRONMENT}/terraform.tfstate" \
            -backend-config="region=$AWS_REGION"

      - name: Validate Terraform
        working-directory: terraform/environments/${{ env.TF_ENVIRONMENT }}
        run: terraform validate

      - name: Terraform Plan
        working-directory: terraform/environments/${{ env.TF_ENVIRONMENT }}
        run: terraform plan -out=tfplan

      - name: Terraform Apply (manual dispatch only)
        if: github.event_name == 'workflow_dispatch' && env.TF_ACTION == 'apply'
        working-directory: terraform/environments/${{ env.TF_ENVIRONMENT }}
        run: terraform apply -auto-approve tfplan
