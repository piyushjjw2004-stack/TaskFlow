name: TaskFlow Continuous Integration (CI)

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  backend-test:
    name: Backend Linting & Pytest Suite
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: taskflow
          POSTGRES_PASSWORD: taskflow_secure_password_123
          POSTGRES_DB: taskflow_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run Backend Pytest Suite
        env:
          DATABASE_URL: postgresql://taskflow:taskflow_secure_password_123@localhost:5432/taskflow_db
          TEST_DATABASE_URL: postgresql://taskflow:taskflow_secure_password_123@localhost:5432/taskflow_db
          SECRET_KEY: ci-testing-secret-key-32-bytes-long!
          ENVIRONMENT: test
        run: |
          pytest backend/tests -v --tb=short

  frontend-check:
    name: Frontend TypeScript & Vite Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm ci

      - name: Run TypeScript Type Check
        run: |
          cd frontend
          npm run lint

      - name: Build Production Bundle
        run: |
          cd frontend
          npm run build

  infrastructure-validation:
    name: Validate Terraform, Helm & Kubernetes Manifests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.10.5

      - name: Terraform Format Check
        run: terraform fmt -check -recursive terraform

      - name: Terraform Validate (dev)
        working-directory: terraform/environments/dev
        run: |
          terraform init -backend=false
          terraform validate

      - name: Terraform Workspace Demo Validation
        working-directory: terraform/workspaces
        run: |
          # Validate the real workspace configuration without contacting AWS/S3.
          terraform init -backend=false
          terraform validate

          # Test Terraform workspace mechanics using an isolated local fixture.
          WORKSPACE_TEST_DIR=$(mktemp -d)

          cat > "$WORKSPACE_TEST_DIR/main.tf" <<'EOF'
          terraform {
            required_version = ">= 1.10.0"
          }

          output "workspace" {
            value = terraform.workspace
          }
          EOF

          cd "$WORKSPACE_TEST_DIR"

          terraform init
          terraform workspace new dev
          terraform workspace new prod
          terraform workspace select prod

          test "$(terraform workspace show)" = "prod"

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.16.4

      - name: Helm Lint
        run: helm lint ./helm/taskflow -f ./helm/taskflow/values-prod.yaml

      - name: Helm Render
        run: |
          helm template taskflow ./helm/taskflow \
            -f ./helm/taskflow/values-prod.yaml \
            --set secret.create=true \
            --set secret.postgresPassword=ci-only-password \
            --set secret.secretKey=ci-only-secret-key-012345678901234567890123456789

      - name: Kustomize Build
        run: kubectl kustomize kubernetes/overlays/prod >/tmp/taskflow-k8s.yaml

  docker-build-check:
    name: Validate Docker Multi-Stage Image Builds
    needs: [backend-test, frontend-check]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Docker Image (Dry Run)
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          tags: taskflow-backend:test

      - name: Build Frontend Docker Image (Dry Run)
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: false
          tags: taskflow-frontend:test