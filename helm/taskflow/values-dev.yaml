global:
  environment: dev

backend:
  replicaCount: 1
  resources:
    limits:
      cpu: 250m
      memory: 256Mi
    requests:
      cpu: 50m
      memory: 128Mi

frontend:
  replicaCount: 1
  resources:
    limits:
      cpu: 150m
      memory: 128Mi
    requests:
      cpu: 25m
      memory: 64Mi

autoscaling:
  enabled: false

secret:
  create: false
  existingSecret: taskflow-secret
