{{- if .Values.secret.create }}
{{- $password := required "secret.postgresPassword is required when secret.create=true" .Values.secret.postgresPassword }}
{{- $secretKey := required "secret.secretKey is required when secret.create=true" .Values.secret.secretKey }}
{{- $encodedPassword := urlquery $password }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.secret.existingSecret }}
  labels:
    {{- include "taskflow.labels" . | nindent 4 }}
type: Opaque
stringData:
  POSTGRES_PASSWORD: {{ $password | quote }}
  DATABASE_URL: {{ printf "postgresql://%s:%s@%s:%v/%s" .Values.config.postgresUser $encodedPassword .Values.config.postgresHost .Values.config.postgresPort .Values.config.postgresDb | quote }}
  SECRET_KEY: {{ $secretKey | quote }}
{{- end }}
