{{- if .Values.database.enabled }}

apiVersion: v1

kind: Service

metadata:

  name: postgres

  labels:

    {{- include "taskflow.labels" . | nindent 4 }}

    app.kubernetes.io/component: database

spec:

  selector:

    {{- include "taskflow.selectorLabels" . | nindent 4 }}

    app.kubernetes.io/component: database

  ports:

    - port: 5432

      targetPort: 5432

      name: postgres

---

apiVersion: apps/v1

kind: StatefulSet

metadata:

  name: {{ include "taskflow.fullname" . }}-postgres

  labels:

    {{- include "taskflow.labels" . | nindent 4 }}

    app.kubernetes.io/component: database

spec:

  serviceName: postgres

  replicas: 1

  selector:

    matchLabels:

      {{- include "taskflow.selectorLabels" . | nindent 6 }}

      app.kubernetes.io/component: database

  template:

    metadata:

      labels:

        {{- include "taskflow.selectorLabels" . | nindent 8 }}

        app.kubernetes.io/component: database

    spec:

      securityContext:

        runAsNonRoot: true

        runAsUser: 999

        runAsGroup: 999

        fsGroup: 999

        seccompProfile:

          type: RuntimeDefault

      containers:

        - name: postgres

          image: {{ .Values.database.image | quote }}

          securityContext:

            allowPrivilegeEscalation: false

            readOnlyRootFilesystem: true

            capabilities:

              drop: ["ALL"]

          ports:

            - containerPort: 5432

          env:

            - name: POSTGRES_DB

              value: {{ .Values.config.postgresDb | quote }}

            - name: POSTGRES_USER

              value: {{ .Values.config.postgresUser | quote }}

            - name: POSTGRES_PASSWORD

              valueFrom:

                secretKeyRef:

                  name: {{ .Values.secret.existingSecret }}

                  key: POSTGRES_PASSWORD

          resources:

            {{- toYaml .Values.database.resources | nindent 12 }}

          readinessProbe:

            exec:

              command: ["pg_isready", "-U", "{{ .Values.config.postgresUser }}", "-d", "{{ .Values.config.postgresDb }}"]

            initialDelaySeconds: 5

            periodSeconds: 10

          livenessProbe:

            exec:

              command: ["pg_isready", "-U", "{{ .Values.config.postgresUser }}", "-d", "{{ .Values.config.postgresDb }}"]

            initialDelaySeconds: 15

            periodSeconds: 20

          volumeMounts:

            - name: postgres-data

              mountPath: /var/lib/postgresql/data

  volumeClaimTemplates:

    - metadata:

        name: postgres-data

      spec:

        accessModes: ["ReadWriteOnce"]

        {{- if .Values.database.storageClass }}

        storageClassName: {{ .Values.database.storageClass | quote }}

        {{- end }}

        resources:

          requests:

            storage: {{ .Values.database.storage }}

{{- end }}